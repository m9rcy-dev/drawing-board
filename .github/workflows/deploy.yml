name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow triggering the deployment manually from the Actions tab
  workflow_dispatch:

# Grant the workflow permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; cancel in-flight runs if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

# Opt into Node.js 24 for all actions to avoid the Node.js 20 deprecation warnings.
# Remove this once the action authors release Node.js 24 native versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --passWithNoTests

      - name: Resolve base path
        id: basepath
        run: |
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            # Use the manually-set variable (useful for custom domains or org repos)
            echo "value=${{ vars.PAGES_BASE_PATH }}" >> $GITHUB_OUTPUT
          else
            # Auto-detect: standard GitHub Pages serves at /repo-name
            echo "value=/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
        run: npm run build

      - name: Disable Jekyll
        # GitHub Pages runs Jekyll by default which ignores any directory whose name
        # starts with an underscore — including Next.js's _next/ folder. Adding a
        # .nojekyll file at the root of the output tells Pages to serve files as-is.
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically enables Pages on first run if it isn't already turned on.
          # Without this, the action fails with "Not Found" if Pages was never activated.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
